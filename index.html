<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rana Abdullah Zamai | Executive Portfolio</title>
  <link rel="icon" type="image/x-icon" href="assets/ico.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'saudi-green': '#004d25',
            'saudi-green-dark': '#003318',
            'luxury-gold': '#c5a059',
            'luxury-gold-light': '#e0c078',
            'charcoal': '#2d3748',
          },
          fontFamily: {
            serif: ['"Playfair Display"', '"Cairo"', 'serif'],
            sans: ['"Lato"', '"Cairo"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    .fade-up {
      animation: fadeUp 1s ease-out forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* Hide scrollbar for clean look */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1; 
    }
    ::-webkit-scrollbar-thumb {
      background: #c5a059; 
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #b08d4b; 
    }
  </style>
